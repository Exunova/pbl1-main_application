appId: com.mapro.app
productName: MAPRO
icon: build/icon.ico
directories:
  buildResources: build
files:
  - out/**
extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
  - from: ../dist/ipc_main.exe
    to: python-bin/ipc_main.exe
  - from: ../backend/src/scraping/cookies.txt
    to: scraping/cookies.txt
asar: true
asarUnpack:
  - python-bin/**
win:
  target:
    - target: nsis
      arch:
        - x64
mac:
  target:
    - target: dmg
      arch:
        - x64
linux:
  target:
    - target: AppImage